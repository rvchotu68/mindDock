services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: minddock-postgres
    environment:
      POSTGRES_USER: minddock
      POSTGRES_PASSWORD: minddock
      POSTGRES_DB: minddock
    ports:
      - "5432:5432"
    volumes:
      - minddock_postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minddock -d minddock"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minddock_postgres:
